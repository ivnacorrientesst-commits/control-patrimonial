name: Aplicar edición, baja y orden de bienes

on:
  push:
    paths:
      - '.github/scripts/patch-editar-baja-orden-bienes.py'
      - '.github/workflows/patch-editar-baja-orden-bienes.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Ejecutar edición y bajas de bienes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python .github/scripts/patch-editar-baja-orden-bienes.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar edición, baja lógica y orden al relevamiento"
          git push origin main
