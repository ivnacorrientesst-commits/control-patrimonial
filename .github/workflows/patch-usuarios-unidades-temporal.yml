name: Aplicar usuarios y cantidades

on:
  push:
    paths:
      - '.github/scripts/patch-usuarios-unidades.py'
      - '.github/workflows/patch-usuarios-unidades-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python .github/scripts/patch-usuarios-unidades.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html administracion.html
          git commit -m "Agregar contraseña inicial y cantidades por unidad"
          git push origin main
