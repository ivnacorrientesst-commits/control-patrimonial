name: Aplicar actas por movimiento

on:
  push:
    paths:
      - '.github/scripts/patch-actas-movimientos-temporal.py'
      - '.github/workflows/patch-actas-movimientos-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche de actas
        run: python .github/scripts/patch-actas-movimientos-temporal.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar actas privadas a movimientos de bienes"
          git push origin main
