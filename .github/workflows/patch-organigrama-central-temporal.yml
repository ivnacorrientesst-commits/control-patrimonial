name: Aplicar organigrama central

on:
  push:
    paths:
      - '.github/workflows/patch-organigrama-central-temporal.yml'
      - '.github/scripts/patch-organigrama.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python .github/scripts/patch-organigrama.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html administracion.html
          git commit -m "Centralizar organigrama, oficinas y responsables"
          git push origin main
