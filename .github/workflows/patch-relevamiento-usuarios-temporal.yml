name: Aplicar relevamiento incremental y usuarios

on:
  push:
    paths:
      - '.github/workflows/patch-relevamiento-usuarios-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualizar interfaz
        shell: python
        run: |
          from pathlib import Path

          def replace_once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'No se encontró bloque: {label}')
              return s.replace(old, new, 1)

          # index.html
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              "let session=null,profile=null,office=null,current=[],pending=[],rel=null,items=[],officePhotos=[],goodPhotos={},newFinds=[],states=[];",
              "let session=null,profile=null,office=null,current=[],pending=[],rel=null,items=[],officePhotos=[],goodPhotos={},newFinds=[],states=[],lastResults={};",
              'variable lastResults'
          )

          s = replace_once(
              s,
              "<button id=\"out\" class=\"btn ghost\">Salir</button>",
              "'+(profile.rol==='admin'?'<a class=\"btn blue\" style=\"text-decoration:none\" href=\"administracion.html#usuarios\">Usuarios y roles</a>':'')+'<button id=\"out\" class=\"btn ghost\">Salir</button>",
              'acceso a usuarios desde panel'
          )

          old_start = "if(current.length)await db.from('relevamiento_items').upsert(current.map(g=>({relevamiento_id:rel.id,bien_id:g.id,resultado:'pendiente'})),{onConflict:'relevamiento_id,bien_id',ignoreDuplicates:true});await loadItems();await loadNewFinds();renderRel()"
          new_start = "await db.from('relevamiento_items').delete().eq('relevamiento_id',rel.id).eq('resultado','pendiente').is('verificado_en',null);await loadItems();await loadLastResults();await loadNewFinds();renderRel()"
          s = replace_once(s, old_start, new_start, 'inicio incremental del relevamiento')

          old_load = "async function loadItems(){const r=await db.from('relevamiento_items').select('bien_id,resultado,observaciones,foto_url').eq('relevamiento_id',rel.id);items=r.data||[]}\nasync function loadNewFinds()"
          new_load = "async function loadItems(){const r=await db.from('relevamiento_items').select('bien_id,resultado,observaciones,foto_url').eq('relevamiento_id',rel.id);items=r.data||[]}\nasync function loadLastResults(){lastResults={};if(!current.length)return;const r=await db.from('relevamiento_items').select('bien_id,resultado,verificado_en,relevamiento_id').in('bien_id',current.map(x=>x.id)).neq('relevamiento_id',rel.id).neq('resultado','pendiente').order('verificado_en',{ascending:false});if(r.error)return;(r.data||[]).forEach(x=>{if(!lastResults[x.bien_id])lastResults[x.bien_id]=x})}\nasync function loadNewFinds()"
          s = replace_once(s, old_load, new_load, 'último resultado histórico')

          s = replace_once(
              s,
              "function it(id){return items.find(x=>x.bien_id===id)||{resultado:'pendiente'}}",
              "function it(id){return items.find(x=>x.bien_id===id)||{resultado:null,observaciones:null,foto_url:null}}\nfunction resultLabel(id){const x=items.find(y=>y.bien_id===id);if(x)return x.resultado;const h=lastResults[id];return h?'Último: '+h.resultado:'Sin revisar'}",
              'etiqueta de resultado'
          )

          s = replace_once(
              s,
              "<div class=\"title\">Bienes de esta oficina</div><div id=\"cur\"></div>",
              "<div class=\"title\">Bienes de esta oficina</div><div class=\"muted\">Solo se guarda lo que revises en este relevamiento. Los bienes que no toques conservan su último control.</div><div id=\"cur\"></div>",
              'aviso relevamiento incremental'
          )

          s = replace_once(
              s,
              "<span class=\"pill\">'+e(x.resultado)+'</span>",
              "<span class=\"pill\">'+e(resultLabel(g.id))+'</span>",
              'pill resultado'
          )

          old_finish = "async function finish(){await loadItems();const p=items.filter(x=>x.resultado==='pendiente').length;if(p&&!confirm('Quedan '+p+' bienes pendientes. Se marcarán faltantes. ¿Finalizar?'))return;if(p)await db.from('relevamiento_items').update({resultado:'faltante',verificado_en:new Date().toISOString()}).eq('relevamiento_id',rel.id).eq('resultado','pendiente');const r=await db.from('relevamientos').update({estado:'cerrado',fecha_cierre:new Date().toISOString()}).eq('id',rel.id);if(r.error){alert(r.error.message);return}rel=null;pub('Relevamiento finalizado y guardado.')}"
          new_finish = "async function finish(){await loadItems();const n=items.length,msg=n?'¿Finalizar relevamiento? Se guardarán únicamente los '+n+' bien(es) que revisaste. Los demás no se modifican.':'¿Finalizar este relevamiento sin modificar bienes?';if(!confirm(msg))return;const r=await db.from('relevamientos').update({estado:'cerrado',fecha_cierre:new Date().toISOString()}).eq('id',rel.id);if(r.error){alert(r.error.message);return}rel=null;pub('Relevamiento finalizado. Los bienes no revisados conservaron su último control sin cambios.')}"
          s = replace_once(s, old_finish, new_finish, 'finalización incremental')

          # validaciones mínimas
          required = [
              'async function loadLastResults()',
              "href=\"administracion.html#usuarios\"",
              "Los bienes que no toques conservan su último control",
              "Los demás no se modifican"
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'Falta validación en index.html: {marker}')
          if "current.map(g=>({relevamiento_id:rel.id,bien_id:g.id,resultado:'pendiente'}))" in s:
              raise SystemExit('Todavía existe la precarga automática de pendientes')

          p.write_text(s, encoding='utf-8')

          # administracion.html
          p = Path('administracion.html')
          a = p.read_text(encoding='utf-8')
          a = replace_once(
              a,
              "let tab='organigrama';",
              "let tab=location.hash==='#usuarios'?'usuarios':'organigrama';",
              'abrir directamente usuarios'
          )
          a = replace_once(
              a,
              "b.onclick=()=>{tab=b.dataset.tab;shell();render()}",
              "b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'','#'+tab);shell();render()}",
              'hash de pestaña'
          )
          a = replace_once(
              a,
              "<div class=\"title\">Autorizar usuario</div><div class=\"muted\">Primero autorizás el correo y el rol. Después la persona crea su propia contraseña desde el enlace de registro.</div>",
              "<div class=\"title\">Crear / autorizar usuario</div><div class=\"muted\">Primero cargás nombre, correo y rol. Después la persona crea su propia contraseña desde el enlace de registro.</div><div class=\"muted\" style=\"margin-top:6px\"><b>Administrador:</b> configuración completa · <b>Operador:</b> gestión de inventario · <b>Relevador:</b> relevamientos · <b>Consulta:</b> solo lectura.</div>",
              'descripción de roles'
          )
          a = replace_once(
              a,
              ">Autorizar / actualizar</button>",
              ">Crear / actualizar usuario</button>",
              'botón usuarios'
          )
          if "location.hash==='#usuarios'" not in a or 'Crear / autorizar usuario' not in a:
              raise SystemExit('No quedó configurada la sección de usuarios')
          p.write_text(a, encoding='utf-8')

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html administracion.html
          git commit -m "Hacer relevamientos incrementales y exponer usuarios"
          git push origin main
