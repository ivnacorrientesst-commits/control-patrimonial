name: Aplicar estados de bienes

on:
  push:
    paths:
      - '.github/workflows/patch-estados-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualizar index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              found = s.count(old)
              if found < count:
                  raise SystemExit(f'No se encontró el bloque esperado: {old[:120]!r} (encontrados {found}, requeridos {count})')
              s = s.replace(old, new, count)

          rep(
              "let session=null,profile=null,office=null,current=[],pending=[],rel=null,items=[],officePhotos=[],goodPhotos={},newFinds=[];",
              "let session=null,profile=null,office=null,current=[],pending=[],rel=null,items=[],officePhotos=[],goodPhotos={},newFinds=[],states=[];"
          )

          old_select = "select('id,codigo,descripcion,marca,modelo,color,cantidad,oficina_id,area_responsable_id')"
          new_select = "select('id,codigo,descripcion,marca,modelo,color,cantidad,oficina_id,area_responsable_id,estado_id,estados(nombre)')"
          if s.count(old_select) < 2:
              raise SystemExit('No se encontraron las dos consultas de bienes esperadas')
          s = s.replace(old_select, new_select, 2)

          rep(
              "async function startRel(){if(!canEdit()){login();return}try{await loadOffice();let q=",
              "async function startRel(){if(!canEdit()){login();return}try{await loadOffice();await loadStates();let q="
          )

          old_load = "async function loadNewFinds(){const r=await db.from('relevamiento_novedades').select('id,descripcion,created_at,datos,bien_id,resuelta,resuelta_en').eq('relevamiento_id',rel.id).eq('tipo','bien_nuevo').order('created_at',{ascending:false});newFinds=r.error?[]:(r.data||[])}\nfunction it(id){return items.find(x=>x.bien_id===id)||{resultado:'pendiente'}}"
          new_load = "async function loadNewFinds(){const r=await db.from('relevamiento_novedades').select('id,descripcion,created_at,datos,bien_id,resuelta,resuelta_en').eq('relevamiento_id',rel.id).eq('tipo','bien_nuevo').order('created_at',{ascending:false});newFinds=r.error?[]:(r.data||[])}\nasync function loadStates(){const order=['Bueno','Regular','Malo','En reparación','Fuera de servicio','Dado de baja','Comodato'],r=await db.from('estados').select('id,nombre').eq('activo',true).in('nombre',order);if(r.error){states=[];return}states=(r.data||[]).sort((a,b)=>order.indexOf(a.nombre)-order.indexOf(b.nombre))}\nfunction stateOptions(selected=''){return '<option value=\"\">Elegí un estado...</option>'+states.map(x=>'<option value=\"'+e(x.id)+'\" '+(x.id===selected?'selected':'')+'>'+e(x.nombre)+'</option>').join('')}\nfunction it(id){return items.find(x=>x.bien_id===id)||{resultado:'pendiente'}}"
          rep(old_load, new_load)

          old_state_line = "+(x.observaciones?'<div class=\"isub\" style=\"margin-top:7px\"><b>Observación:</b> '+e(x.observaciones)+'</div>':'')+'<div class=\"isub\">Fotos del bien: '+photos.length"
          new_state_line = "+(x.observaciones?'<div class=\"isub\" style=\"margin-top:7px\"><b>Observación:</b> '+e(x.observaciones)+'</div>':'')+'<div class=\"isub\" style=\"margin-top:7px\"><b>Estado:</b> '+e(g.estados?.nombre||'Sin estado')+'</div><div class=\"isub\">Fotos del bien: '+photos.length"
          rep(old_state_line, new_state_line)

          rep(
              "<button class=\"btn orange\" data-o=\"'+g.id+'\">Observación</button><button class=\"btn purple\" data-photocamera=\"'+g.id+'\">📷 Sacar foto</button>",
              "<button class=\"btn orange\" data-o=\"'+g.id+'\">Observación</button><button class=\"btn blue\" data-state=\"'+g.id+'\">Cambiar estado</button><button class=\"btn purple\" data-photocamera=\"'+g.id+'\">📷 Sacar foto</button>"
          )

          rep(
              "document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>obsForm(b.dataset.o));document.querySelectorAll('[data-photocamera]')",
              "document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>obsForm(b.dataset.o));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>changeStateForm(b.dataset.state));document.querySelectorAll('[data-photocamera]')"
          )

          marker = "async function mark(id,res,extra={})"
          state_funcs = "function changeStateForm(id){const g=current.find(x=>x.id===id);if(!g)return;app.innerHTML='<div class=\"hero\"><small>ESTADO DEL BIEN</small><h2>'+e(g.descripcion||'Bien')+'</h2><small>Estado actual: '+e(g.estados?.nombre||'Sin estado')+'</small></div><div class=\"card\"><div class=\"field\"><label>Nuevo estado</label><select id=\"newstate\" required>'+stateOptions(g.estado_id||'')+'</select></div><div class=\"hint\">Encontrado/Faltante indica si el bien está físicamente en la oficina. Este campo indica su estado o condición.</div><div class=\"actions\"><button id=\"savestate\" class=\"btn green\">Guardar estado</button><button id=\"cancelstate\" class=\"btn ghost\">Cancelar</button></div></div>';document.getElementById('cancelstate').onclick=renderRel;document.getElementById('savestate').onclick=()=>saveStateChange(id)}\nasync function saveStateChange(id){const estadoId=document.getElementById('newstate').value;if(!estadoId){alert('Elegí un estado.');return}const estado=states.find(x=>x.id===estadoId);if(!confirm('¿Cambiar el estado del bien a “'+(estado?.nombre||'seleccionado')+'”?'))return;busy('Guardando estado...');try{const r=await db.rpc('cambiar_estado_bien_relevamiento',{p_bien_id:id,p_estado_id:estadoId,p_relevamiento_id:rel.id});if(r.error)throw r.error;await loadOffice();await loadItems();renderRel();alert(r.data?.sin_cambios?'El bien ya tenía ese estado.':'Estado actualizado y registrado en el historial del relevamiento.')}catch(err){alert('No se pudo cambiar el estado: '+(err.message||err))}finally{unbusy()}}\n"
          if marker not in s:
              raise SystemExit('No se encontró mark() para insertar cambio de estado')
          s = s.replace(marker, state_funcs + marker, 1)

          old_promote = "async function promoteNewFind(id){const n=newFinds.find(x=>x.id===id);if(!n)return;if(n.resuelta&&n.bien_id){alert('Este bien ya fue incorporado al inventario.');return}if(!confirm('¿Agregar “'+(n.descripcion||'Bien nuevo')+'” al inventario de '+office.nombre+'?'))return;busy('Agregando bien al inventario...');try{const r=await db.rpc('incorporar_bien_nuevo_relevamiento',{p_novedad_id:id});if(r.error)throw r.error;await loadOffice();await loadItems();await loadNewFinds();renderRel();alert('Bien agregado al inventario y marcado como encontrado.')}catch(err){alert('No se pudo agregar el bien: '+(err.message||err))}finally{unbusy()}}"
          new_promote = "async function promoteNewFind(id){const n=newFinds.find(x=>x.id===id);if(!n)return;if(n.resuelta&&n.bien_id){alert('Este bien ya fue incorporado al inventario.');return}if(!states.length)await loadStates();app.innerHTML='<div class=\"hero\"><small>INCORPORAR BIEN NUEVO</small><h2>'+e(n.descripcion||'Bien nuevo')+'</h2><small>'+e(office.nombre)+'</small></div><div class=\"card\"><div class=\"field\"><label>Estado inicial del bien</label><select id=\"initialstate\" required>'+stateOptions('')+'</select></div><div class=\"hint\">El bien se incorporará a esta oficina y quedará marcado como Encontrado en el relevamiento.</div><div class=\"actions\"><button id=\"confirmnew\" class=\"btn green\">Agregar al inventario</button><button id=\"cancelnew\" class=\"btn ghost\">Cancelar</button></div></div>';document.getElementById('cancelnew').onclick=renderRel;document.getElementById('confirmnew').onclick=()=>confirmPromoteNewFind(id)}\nasync function confirmPromoteNewFind(id){const n=newFinds.find(x=>x.id===id),estadoId=document.getElementById('initialstate').value;if(!n)return;if(!estadoId){alert('Elegí el estado inicial del bien.');return}const estado=states.find(x=>x.id===estadoId);if(!confirm('¿Agregar “'+(n.descripcion||'Bien nuevo')+'” al inventario con estado “'+(estado?.nombre||'seleccionado')+'”?'))return;busy('Agregando bien al inventario...');try{const r=await db.rpc('incorporar_bien_nuevo_relevamiento',{p_novedad_id:id,p_estado_id:estadoId});if(r.error)throw r.error;await loadOffice();await loadItems();await loadNewFinds();renderRel();alert('Bien agregado al inventario con estado '+(estado?.nombre||'seleccionado')+' y marcado como encontrado.')}catch(err){alert('No se pudo agregar el bien: '+(err.message||err))}finally{unbusy()}}"
          rep(old_promote, new_promote)

          p.write_text(s, encoding='utf-8')

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar estados de bienes al relevamiento"
          git push origin main
