name: Aplicar buscador y navegación del relevamiento

on:
  push:
    paths:
      - '.github/scripts/patch-relevamiento-buscador-posicion.py'
      - '.github/workflows/patch-relevamiento-buscador-posicion-temporal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python .github/scripts/patch-relevamiento-buscador-posicion.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Agregar buscador y conservar posición en relevamiento"
          git push origin main
