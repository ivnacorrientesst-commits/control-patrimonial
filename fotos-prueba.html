<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><title>Prueba de Fotos · Control Patrimonial</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f6f8;color:#17212b}.top{background:linear-gradient(135deg,#087f5b,#0ca678);color:#fff;padding:14px}.wrap{max-width:850px;margin:auto;padding:10px}.hero,.card,.item{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #0001}.hero{background:linear-gradient(135deg,#087f5b,#12b886);color:#fff}.btn{border:0;border-radius:11px;padding:12px 13px;font-weight:800;cursor:pointer;text-align:center}.green{background:#087f5b;color:#fff}.blue{background:#1971c2;color:#fff}.purple{background:#7048e8;color:#fff}.red{background:#d9480f;color:#fff}.ghost{background:#edf2f4;color:#263238}.row,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.actions .btn{flex:1 1 140px}.title{font-size:20px;font-weight:900}.ititle{font-weight:850}.muted,.isub{font-size:13px;color:#667085}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#e6fcf5;color:#087f5b;font-size:12px;font-weight:800}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}.photo{background:#fff;border-radius:13px;padding:7px;box-shadow:0 2px 9px #0001}.photo img{width:100%;height:170px;object-fit:cover;border-radius:9px;background:#eee}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}input{width:100%;padding:12px;border:1px solid #cfd8dc;border-radius:10px;font:inherit}.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:10px}.ok{background:#ebfbee;color:#2b8a3e;padding:10px;border-radius:10px}.busy{position:fixed;inset:0;background:#0009;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;z-index:999}.hint{background:#f8f9fa;border:1px dashed #adb5bd;padding:10px;border-radius:10px;font-size:13px;color:#495057}@media(max-width:600px){.actions .btn{flex:1 1 44%}.wrap{padding:8px}}</style></head><body><div class="top"><b>Municipalidad de Santo Tomé</b><div style="font-size:13px;opacity:.9">Control Patrimonial · Prueba de Fotos</div></div><div id="app" class="wrap">Cargando...</div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.112.2';const db=createClient('https://jqbeweclwqquevfpycyh.supabase.co','sb_publishable_pmrA8WStSO7tYb9yEeYMQQ_dQiDNIFm');const BUCKET='patrimonio-fotos';const app=document.getElementById('app');const slug=new URLSearchParams(location.search).get('qr')||'of-649b2c94e75a4012';let session=null,profile=null,office=null,goods=[],officePhotos=[],goodPhotos={};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function busy(t='Procesando foto...'){let d=document.createElement('div');d.className='busy';d.id='busy';d.textContent=t;document.body.appendChild(d)}function unbusy(){document.getElementById('busy')?.remove()}async function auth(){const s=await db.auth.getSession();session=s.data.session||null;if(!session)return;const p=await db.from('profiles').select('id,email,nombre,rol,activo').eq('id',session.user.id).single();profile=p.data||null}function can(){return profile?.activo&&['admin','operador','relevador'].includes(profile.rol)}function pick(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);i.onchange=()=>{const f=i.files?.[0]||null;i.remove();r(f)};i.click()})}async function compress(file){const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(bmp,0,0,w,h);bmp.close?.();let q=.76,b=null;for(let x=0;x<4;x++){b=await new Promise(r=>c.toBlob(r,'image/webp',q));if(b&&b.size<1500*1024)break;q-=.1}if(!b)b=await new Promise(r=>c.toBlob(r,'image/jpeg',.75));if(!b)throw Error('No se pudo comprimir');return b}async function upload(folder){const f=await pick();if(!f)return null;busy('Comprimiendo y subiendo...');try{const b=await compress(f);const ext=b.type==='image/webp'?'webp':'jpg';const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;const u=await db.storage.from(BUCKET).upload(path,b,{contentType:b.type,upsert:false});if(u.error)throw u.error;return{path,size:b.size,original:f.size}}finally{unbusy()}}async function signed(path){const r=await db.storage.from(BUCKET).createSignedUrl(path,3600);return r.data?.signedUrl||''}async function load(){const o=await db.from('oficinas').select('id,nombre,area_id,slug_qr,areas(nombre),sedes(nombre)').eq('slug_qr',slug).eq('activa',true).single();if(o.error)throw o.error;office=o.data;const g=await db.from('bienes').select('id,descripcion,codigo,marca,modelo,observaciones').eq('oficina_id',office.id).eq('activo',true).order('descripcion');if(g.error)throw g.error;goods=g.data||[];const fo=await db.from('fotos_oficinas').select('id,ruta_storage,descripcion,created_at').eq('oficina_id',office.id).order('created_at',{ascending:false});if(fo.error)throw fo.error;officePhotos=fo.data||[];goodPhotos={};if(goods.length){const fg=await db.from('fotos_bienes').select('id,bien_id,ruta_storage,descripcion,created_at').in('bien_id',goods.map(x=>x.id)).order('created_at',{ascending:false});if(fg.error)throw fg.error;(fg.data||[]).forEach(x=>(goodPhotos[x.bien_id]??=[]).push(x))}}async function addOffice(){const u=await upload('oficinas/'+office.id);if(!u)return;const r=await db.from('fotos_oficinas').insert({oficina_id:office.id,ruta_storage:u.path,descripcion:'Foto general tomada durante prueba',es_principal:officePhotos.length===0,subida_por:session.user.id});if(r.error){await db.storage.from(BUCKET).remove([u.path]);return alert(r.error.message)}alert('Foto guardada. Original: '+Math.round(u.original/1024)+' KB · subida: '+Math.round(u.size/1024)+' KB');await load();render()}async function addGood(id){const u=await upload('bienes/'+id);if(!u)return;const r=await db.from('fotos_bienes').insert({bien_id:id,ruta_storage:u.path,descripcion:'Foto tomada durante prueba',es_principal:!(goodPhotos[id]?.length)});if(r.error){await db.storage.from(BUCKET).remove([u.path]);return alert(r.error.message)}alert('Foto guardada. Original: '+Math.round(u.original/1024)+' KB · subida: '+Math.round(u.size/1024)+' KB');await load();render()}async function observation(id){const text=prompt('Escribí una observación de prueba:','Prueba de observación con evidencia fotográfica');if(!text)return;let q=await db.from('relevamientos').select('id').eq('oficina_id',office.id).eq('realizado_por',session.user.id).eq('estado','abierto').maybeSingle();let rel=q.data;if(!rel){const n=await db.from('relevamientos').insert({oficina_id:office.id,realizado_por:session.user.id,estado:'abierto'}).select('id').single();if(n.error)return alert(n.error.message);rel=n.data}const u=await upload('relevamientos/'+rel.id+'/observaciones/'+id);if(!u)return;const ri=await db.from('relevamiento_items').upsert({relevamiento_id:rel.id,bien_id:id,resultado:'observado',observaciones:text,oficina_observada_id:office.id,verificado_en:new Date().toISOString(),foto_url:u.path},{onConflict:'relevamiento_id,bien_id'});if(ri.error){await db.storage.from(BUCKET).remove([u.path]);return alert(ri.error.message)}alert('Observación y evidencia guardadas. Foto subida: '+Math.round(u.size/1024)+' KB')}async function gallery(title,rows,back){busy('Abriendo fotos...');try{let a=[];for(const x of rows)a.push({...x,url:await signed(x.ruta_storage)});app.innerHTML='<div class="hero"><small>GALERÍA PRIVADA</small><h2>'+e(title)+'</h2><div>'+a.length+' foto(s)</div></div><div class="photos">'+a.map(x=>'<div class="photo"><img src="'+e(x.url)+'"><div class="isub">'+e(x.descripcion||'')+'</div></div>').join('')+'</div><button id="backgal" class="btn ghost" style="width:100%;margin-top:12px">Volver</button>';document.getElementById('backgal').onclick=back}finally{unbusy()}}function login(){app.innerHTML='<div class="card" style="max-width:430px;margin:8vh auto"><div class="title">Ingresar</div><div id="err"></div><form id="lf"><div class="field"><label>Correo</label><input id="em" type="email" required></div><div class="field"><label>Contraseña</label><input id="pw" type="password" required></div><button class="btn green" style="width:100%">Ingresar</button></form></div>';document.getElementById('lf').onsubmit=async ev=>{ev.preventDefault();const r=await db.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});if(r.error){document.getElementById('err').innerHTML='<div class="error">'+e(r.error.message)+'</div>';return}await boot()}}function render(){app.innerHTML='<div class="hero"><small>PRUEBA CONTROLADA</small><h2 style="margin:4px 0">'+e(office.nombre)+'</h2><div>'+e(office.areas?.nombre||'')+' · '+e(office.sedes?.nombre||'')+'</div></div><div class="hint">Las imágenes se reducen a un máximo de 1600 px y se comprimen antes de subir. El bucket es privado: las fotos no forman parte del inventario público del QR.</div><div class="card"><div class="ititle">Foto general de la oficina</div><div class="isub">Guardadas: '+officePhotos.length+'</div><div class="actions"><button id="addoffice" class="btn purple">📷 Sacar / agregar foto</button>'+(officePhotos.length?'<button id="seeoffice" class="btn ghost">Ver fotos</button>':'')+'</div></div><div class="title">Bienes de esta oficina</div>'+goods.map(g=>'<div class="item"><div class="ititle">'+e(g.descripcion)+'</div><div class="isub">'+e([g.codigo&&'Código '+g.codigo,g.marca,g.modelo].filter(Boolean).join(' · '))+'</div><span class="pill">'+(goodPhotos[g.id]?.length||0)+' foto(s)</span><div class="actions"><button class="btn purple" data-add="'+g.id+'">📷 Foto del bien</button>'+(goodPhotos[g.id]?.length?'<button class="btn ghost" data-see="'+g.id+'">Ver fotos</button>':'')+'<button class="btn blue" data-obs="'+g.id+'">Observación + foto</button></div></div>').join('')+'<div class="row" style="margin-top:14px"><a class="btn ghost" style="text-decoration:none" href="./?qr='+encodeURIComponent(slug)+'">Volver al inventario</a><a class="btn blue" style="text-decoration:none" href="./">Panel general</a></div><div class="muted" style="text-align:center;margin-top:15px">'+e(profile.nombre||profile.email)+' · '+e(profile.rol)+'</div>';document.getElementById('addoffice').onclick=addOffice;if(document.getElementById('seeoffice'))document.getElementById('seeoffice').onclick=()=>gallery('Fotos de '+office.nombre,officePhotos,render);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addGood(b.dataset.add));document.querySelectorAll('[data-see]').forEach(b=>b.onclick=()=>{const g=goods.find(x=>x.id===b.dataset.see);gallery(g?.descripcion||'Fotos del bien',goodPhotos[b.dataset.see]||[],render)});document.querySelectorAll('[data-obs]').forEach(b=>b.onclick=()=>observation(b.dataset.obs))}async function boot(){await auth();if(!session||!can()){login();return}try{await load();render()}catch(err){app.innerHTML='<div class="error">'+e(err.message||err)+'</div>'}}boot();</script></body></html>
