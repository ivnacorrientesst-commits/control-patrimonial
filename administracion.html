<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f6f8;color:#17212b}.top{background:linear-gradient(135deg,#087f5b,#0ca678);color:#fff;padding:14px}.wrap{max-width:1050px;margin:auto;padding:12px}.hero,.card,.item{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #0001}.hero{background:linear-gradient(135deg,#087f5b,#12b886);color:#fff}.title{font-size:20px;font-weight:900}.ititle{font-weight:850}.muted,.isub{color:#667085;font-size:13px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.green{background:#087f5b;color:#fff}.blue{background:#1971c2;color:#fff}.red{background:#d9480f;color:#fff}.orange{background:#f08c00;color:#fff}.ghost{background:#edf2f4;color:#263238}.row,.actions,.tabs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.tabs{margin:12px 0}.tabs .btn.active{background:#087f5b;color:#fff}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd8dc;border-radius:10px;font:inherit;background:#fff}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pill{display:inline-block;border-radius:999px;padding:5px 8px;background:#e6fcf5;color:#087f5b;font-size:12px;font-weight:800}.pill.off{background:#fff3bf;color:#8a5b00}.error{background:#fff0f0;color:#b42318;border:1px solid #ffc9c9;padding:10px;border-radius:10px}.ok{background:#ebfbee;color:#2b8a3e;border:1px solid #b2f2bb;padding:10px;border-radius:10px}.tree{border-left:2px solid #dee2e6;margin-left:8px;padding-left:12px}.small{font-size:12px}.link{color:#1971c2;text-decoration:none;font-weight:800}.org-office{margin:8px 0 0 18px;padding:10px 12px;border-left:3px solid #74c0fc;background:#f8fbff;border-radius:10px}.org-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.org-section{margin-top:10px;padding-top:8px;border-top:1px solid #edf2f4}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:8px}.actions .btn{flex:1 1 42%}}
</style>
</head>
<body>
<div class="top"><b>Municipalidad de Santo Tomé</b><div style="font-size:13px;opacity:.9">Control Patrimonial · Administración</div></div>
<div id="app" class="wrap">Cargando...</div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.112.2';
const SUPABASE_URL='https://jqbeweclwqquevfpycyh.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_pmrA8WStSO7tYb9yEeYMQQ_dQiDNIFm';
const db=createClient(SUPABASE_URL,PUBLISHABLE_KEY);
const app=document.getElementById('app');
let session=null,profile=null,areas=[],offices=[],sedes=[],authorized=[],profiles=[],responsables=[],assignments=[],counts={};
const validTabs=['organigrama','oficinas','usuarios','responsables'];let tab=validTabs.includes(location.hash.slice(1))?location.hash.slice(1):'organigrama';
const e=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=location.href.replace(/administracion\.html.*$/,'');
async function auth(){const s=await db.auth.getSession();session=s.data.session||null;if(!session)return;const p=await db.from('profiles').select('id,email,nombre,rol,activo').eq('id',session.user.id).single();profile=p.data||null}
async function load(){
const rs=await Promise.all([
db.from('areas').select('id,nombre,tipo,area_padre_id,activo').order('nombre'),
db.from('oficinas').select('id,nombre,numero,referencia,slug_qr,activa,area_id,sede_id,areas(nombre),sedes(nombre)').order('nombre'),
db.from('sedes').select('id,nombre,activa').eq('activa',true).order('nombre'),
db.from('usuarios_autorizados').select('id,email,nombre,rol,activo').order('email'),
db.from('profiles').select('id,email,nombre,rol,activo').order('email'),
db.from('responsables').select('id,nombre,documento,cargo,area_id,activo').order('nombre'),
db.from('asignaciones_responsables').select('id,area_id,oficina_id,responsable_id,cargo,fecha_desde,fecha_hasta,observaciones,responsables(nombre),areas(nombre),oficinas(nombre)').order('created_at',{ascending:false}),
db.from('bienes').select('oficina_id,area_responsable_id').eq('activo',true)
]);
for(const r of rs){if(r.error)throw r.error}
[areas,offices,sedes,authorized,profiles,responsables,assignments]=rs.slice(0,7).map(r=>r.data||[]);
counts={};(rs[7].data||[]).forEach(b=>{if(b.oficina_id)counts['o:'+b.oficina_id]=(counts['o:'+b.oficina_id]||0)+1;if(b.area_responsable_id)counts['a:'+b.area_responsable_id]=(counts['a:'+b.area_responsable_id]||0)+1});
}
function shell(){
app.innerHTML='<div class="hero"><small>ADMINISTRACIÓN</small><h2 style="margin:4px 0">Organigrama central y configuración</h2><div>Dependencias, oficinas y encargados se administran desde un solo lugar y los cambios se reflejan en todo el sistema.</div></div><div class="between"><div class="tabs"><button class="btn ghost" data-tab="organigrama">Organigrama</button><button class="btn ghost" data-tab="oficinas">Oficinas</button><button class="btn ghost" data-tab="usuarios">Usuarios</button><button class="btn ghost" data-tab="responsables">Responsables</button></div><div class="row"><a class="btn blue" style="text-decoration:none" href="'+base+'">Panel general</a><button id="reload" class="btn ghost">Actualizar</button></div></div><div id="view"></div><div class="muted" style="text-align:center;margin:16px">Administrador: '+e(profile?.nombre||profile?.email||'')+'</div>';
document.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.classList.add('active');b.onclick=()=>{tab=b.dataset.tab;history.replaceState(null,'','#'+tab);shell();render()}});document.getElementById('reload').onclick=async()=>{await load();shell();render()};render();
}
function render(){if(tab==='organigrama')renderAreas();else if(tab==='oficinas')renderOffices();else if(tab==='usuarios')renderUsers();else renderResponsables()}
function areaOptions(selected='',exclude=''){return '<option value="">Sin área superior</option>'+areas.filter(a=>a.activo&&a.id!==exclude).map(a=>'<option value="'+a.id+'" '+(a.id===selected?'selected':'')+'>'+e(a.nombre)+'</option>').join('')}
function currentAssign(type,id){return assignments.find(x=>!x.fecha_hasta&&(type==='area'?(x.area_id===id&&!x.oficina_id):x.oficina_id===id))||null}
function renderAreas(){
const v=document.getElementById('view');
v.innerHTML='<div class="grid"><div class="card"><div class="title">Nueva área / dependencia</div><form id="newarea"><div class="field"><label>Nombre</label><input id="aname" required placeholder="Ej.: Dirección de Personal"></div><div class="grid"><div class="field"><label>Tipo</label><input id="atype" placeholder="Secretaría, Dirección, Coordinación..."></div><div class="field"><label>Depende de</label><select id="aparent">'+areaOptions()+'</select></div></div><button class="btn green">Crear área</button></form></div><div class="card"><div class="title">Nuevo responsable / encargado</div><div class="muted">Después lo asignás directamente a un área u oficina desde el organigrama de abajo.</div><form id="rform"><div class="field"><label>Nombre</label><input id="rname" required></div><div class="grid"><div class="field"><label>Cargo</label><input id="rcargo" placeholder="Director, Secretario, encargado..."></div><div class="field"><label>Documento (opcional)</label><input id="rdoc"></div></div><button class="btn green">Guardar responsable</button></form></div></div><div class="card"><div class="title">Organigrama municipal</div><div class="muted">Este es el punto central de configuración. Si cambiás el nombre de un área, su dependencia, una oficina o su encargado, el sistema usa el dato actualizado sin cambiar los QR ni perder historial.</div><div class="muted" style="margin-top:5px">La hoja “Listas” del archivo original queda como referencia inicial de nombres; la estructura vigente se administra acá.</div><div id="alist"></div></div>';
document.getElementById('newarea').onsubmit=async ev=>{ev.preventDefault();const r=await db.from('areas').insert({nombre:document.getElementById('aname').value.trim(),tipo:document.getElementById('atype').value.trim()||null,area_padre_id:document.getElementById('aparent').value||null}).select().single();if(r.error)return alert(r.error.message);await refresh('Área creada.')};
document.getElementById('rform').onsubmit=saveResp;
const roots=areas.filter(a=>!a.area_padre_id||!areas.some(x=>x.id===a.area_padre_id));
const children=id=>areas.filter(a=>a.area_padre_id===id);
function node(a,depth=0){const kids=children(a.id),active=a.activo,aa=currentAssign('area',a.id),ofs=offices.filter(o=>o.area_id===a.id),parent=a.area_padre_id?areas.find(x=>x.id===a.area_padre_id):null;const officeHtml=ofs.map(o=>{const oa=currentAssign('oficina',o.id),c=counts['o:'+o.id]||0;return '<div class="org-office"><div class="between"><div><div class="ititle">'+e(o.nombre)+'</div><div class="isub">Oficina / sector · '+e(o.sedes?.nombre||'Sin sede')+(o.referencia?' · '+e(o.referencia):'')+'</div></div><div><span class="pill">'+c+' bienes</span> <span class="pill '+(o.activa?'':'off')+'">'+(o.activa?'Activa':'Inactiva')+'</span></div></div><div class="org-meta"><span class="pill '+(oa?'':'off')+'">Encargado: '+e(oa?.responsables?.nombre||'Sin asignar')+'</span>'+(oa?.cargo?'<span class="pill">'+e(oa.cargo)+'</span>':'')+'</div><div class="actions"><button class="btn blue" data-orgoedit="'+o.id+'">Editar oficina</button><button class="btn green" data-orgassign="oficina:'+o.id+'">'+(oa?'Cambiar encargado':'Asignar encargado')+'</button>'+(oa?'<button class="btn orange" data-orgend="'+oa.id+'">Finalizar encargado</button>':'')+'<a class="btn ghost" style="text-decoration:none;text-align:center" href="'+base+'?qr='+encodeURIComponent(o.slug_qr)+'">Abrir inventario</a></div></div>'}).join('');return '<div class="item" style="margin-left:'+Math.min(depth*18,72)+'px"><div class="between"><div><div class="ititle">'+e(a.nombre)+'</div><div class="isub">'+e(a.tipo||'Área / dependencia')+(parent?' · depende de '+e(parent.nombre):' · nivel principal')+'</div></div><span class="pill '+(active?'':'off')+'">'+(active?'Activa':'Inactiva')+'</span></div><div class="org-meta"><span class="pill">'+(counts['a:'+a.id]||0)+' bienes responsables</span><span class="pill">'+ofs.length+' oficinas / sectores</span><span class="pill '+(aa?'':'off')+'">Responsable: '+e(aa?.responsables?.nombre||'Sin asignar')+'</span>'+(aa?.cargo?'<span class="pill">'+e(aa.cargo)+'</span>':'')+'</div><div class="actions"><button class="btn blue" data-aedit="'+a.id+'">Editar área / dependencia</button><button class="btn green" data-orgassign="area:'+a.id+'">'+(aa?'Cambiar responsable':'Asignar responsable')+'</button>'+(aa?'<button class="btn orange" data-orgend="'+aa.id+'">Finalizar responsable</button>':'')+'<button class="btn '+(active?'orange':'green')+'" data-atoggle="'+a.id+'">'+(active?'Desactivar':'Activar')+'</button></div>'+(officeHtml?'<div class="org-section"><div class="isub"><b>Oficinas / sectores de esta dependencia</b></div>'+officeHtml+'</div>':'')+'</div>'+kids.map(k=>node(k,depth+1)).join('')}
document.getElementById('alist').innerHTML=roots.map(r=>node(r)).join('')||'<div class="muted">Todavía no hay áreas cargadas.</div>';
document.querySelectorAll('[data-aedit]').forEach(b=>b.onclick=()=>editArea(b.dataset.aedit));document.querySelectorAll('[data-atoggle]').forEach(b=>b.onclick=()=>toggleArea(b.dataset.atoggle));document.querySelectorAll('[data-orgoedit]').forEach(b=>b.onclick=()=>editOfficeFromOrg(b.dataset.orgoedit));document.querySelectorAll('[data-orgassign]').forEach(b=>b.onclick=()=>{const [type,id]=b.dataset.orgassign.split(':');assignFromOrg(type,id)});document.querySelectorAll('[data-orgend]').forEach(b=>b.onclick=()=>endAssign(b.dataset.orgend));
}
async function editOfficeFromOrg(id){const o=offices.find(x=>x.id===id);if(!o)return;const name=prompt('Nombre de la oficina / sector:',o.nombre);if(!name||!name.trim())return;const list=areas.filter(a=>a.activo);let msg='¿De qué área depende esta oficina?\n';list.forEach((x,i)=>msg+=(i+1)+' - '+x.nombre+'\n');const cur=Math.max(1,list.findIndex(x=>x.id===o.area_id)+1),n=prompt(msg,String(cur));if(n===null)return;const ix=Number(n)-1;if(!list[ix])return alert('Área no válida.');const ref=prompt('Referencia física / ubicación:',o.referencia||'');if(ref===null)return;const r=await db.from('oficinas').update({nombre:name.trim(),area_id:list[ix].id,referencia:ref.trim()||null}).eq('id',id);if(r.error)return alert(r.error.message);await refresh('Oficina actualizada desde el organigrama. El QR no cambió.')}
async function assignFromOrg(type,id){const list=responsables.filter(r=>r.activo);if(!list.length)return alert('Primero creá un responsable en el formulario de arriba.');const current=currentAssign(type,id);let msg='Elegí responsable / encargado:\n';list.forEach((x,i)=>msg+=(i+1)+' - '+x.nombre+(x.cargo?' ('+x.cargo+')':'')+'\n');const cur=current?Math.max(1,list.findIndex(x=>x.id===current.responsable_id)+1):1,n=prompt(msg,String(cur));if(n===null)return;const ix=Number(n)-1;if(!list[ix])return alert('Responsable no válido.');const cargo=prompt('Cargo en este destino:',current?.cargo||list[ix].cargo||'Encargado');if(cargo===null)return;const today=new Date().toISOString().slice(0,10);let q=db.from('asignaciones_responsables').update({fecha_hasta:today}).is('fecha_hasta',null);q=type==='area'?q.eq('area_id',id).is('oficina_id',null):q.eq('oficina_id',id);let r=await q;if(r.error)return alert(r.error.message);const data={responsable_id:list[ix].id,cargo:cargo.trim()||null,fecha_desde:today};if(type==='area')data.area_id=id;else data.oficina_id=id;r=await db.from('asignaciones_responsables').insert(data);if(r.error)return alert(r.error.message);await refresh('Responsable / encargado actualizado en el organigrama.')}
async function editArea(id){const a=areas.find(x=>x.id===id);if(!a)return;const name=prompt('Nombre del área:',a.nombre);if(!name||!name.trim())return;const tipo=prompt('Tipo (Secretaría, Dirección, etc.):',a.tipo||'')??a.tipo;const parentList=areas.filter(x=>x.activo&&x.id!==id);let msg='Área superior. Escribí 0 para ninguna:\n0 - Ninguna\n';parentList.forEach((x,i)=>msg+=(i+1)+' - '+x.nombre+'\n');let current=a.area_padre_id?parentList.findIndex(x=>x.id===a.area_padre_id)+1:0;const n=prompt(msg,String(Math.max(current,0)));if(n===null)return;const ix=Number(n);const parent=ix>0&&parentList[ix-1]?parentList[ix-1].id:null;const r=await db.from('areas').update({nombre:name.trim(),tipo:(tipo||'').trim()||null,area_padre_id:parent}).eq('id',id);if(r.error)return alert(r.error.message);await refresh('Área actualizada. El nuevo nombre ya se usa en la aplicación.')}
async function toggleArea(id){const a=areas.find(x=>x.id===id);if(!a)return;if(a.activo){const oc=offices.filter(o=>o.area_id===id&&o.activa).length,bc=counts['a:'+id]||0,cc=areas.filter(x=>x.area_padre_id===id&&x.activo).length;if(oc||bc||cc)return alert('No se puede desactivar todavía. Tiene '+oc+' oficinas activas, '+bc+' bienes responsables y '+cc+' áreas dependientes. Primero hay que reasignarlos o desactivarlos.');if(!confirm('¿Desactivar '+a.nombre+'? No se borra el historial.'))return}const r=await db.from('areas').update({activo:!a.activo}).eq('id',id);if(r.error)return alert(r.error.message);await refresh(a.activo?'Área desactivada.':'Área reactivada.')}
function renderOffices(){
const v=document.getElementById('view');
v.innerHTML='<div class="card"><div class="title" id="oftitle">Nueva oficina / sector</div><form id="offform"><input type="hidden" id="oid"><div class="grid"><div class="field"><label>Nombre</label><input id="oname" required></div><div class="field"><label>Área</label><select id="oarea" required><option value="">Elegí...</option>'+areas.filter(a=>a.activo).map(a=>'<option value="'+a.id+'">'+e(a.nombre)+'</option>').join('')+'</select></div><div class="field"><label>Sede</label><select id="osede" required>'+sedes.map(s=>'<option value="'+s.id+'">'+e(s.nombre)+'</option>').join('')+'</select></div><div class="field"><label>Referencia</label><input id="oref" placeholder="Ej.: planta baja, sector interno..."></div></div><div class="actions"><button class="btn green">Guardar</button><button type="button" id="ocancel" class="btn ghost">Cancelar edición</button></div></form></div><div class="card"><div class="title">Oficinas y sectores</div><div class="muted">Duplicar copia la estructura de la oficina, pero nunca copia bienes.</div><div id="olist"></div></div>';
document.getElementById('ocancel').onclick=resetOfficeForm;document.getElementById('offform').onsubmit=saveOffice;
document.getElementById('olist').innerHTML=offices.map(o=>{const c=counts['o:'+o.id]||0;return '<div class="item"><div class="between"><div><div class="ititle">'+e(o.nombre)+'</div><div class="isub">'+e(o.areas?.nombre||'Sin área')+' · '+e(o.sedes?.nombre||'Sin sede')+'</div></div><div><span class="pill">'+c+' bienes</span> <span class="pill '+(o.activa?'':'off')+'">'+(o.activa?'Activa':'Inactiva')+'</span></div></div>'+(o.referencia?'<div class="isub">'+e(o.referencia)+'</div>':'')+'<div class="actions"><button class="btn blue" data-oedit="'+o.id+'">Editar</button><button class="btn ghost" data-odup="'+o.id+'">Duplicar</button><a class="btn green" style="text-decoration:none;text-align:center" href="'+base+'?qr='+encodeURIComponent(o.slug_qr)+'">Abrir</a><button class="btn '+(o.activa?'orange':'green')+'" data-otoggle="'+o.id+'">'+(o.activa?'Desactivar':'Activar')+'</button></div></div>'}).join('');
document.querySelectorAll('[data-oedit]').forEach(b=>b.onclick=()=>editOffice(b.dataset.oedit));document.querySelectorAll('[data-odup]').forEach(b=>b.onclick=()=>duplicateOffice(b.dataset.odup));document.querySelectorAll('[data-otoggle]').forEach(b=>b.onclick=()=>toggleOffice(b.dataset.otoggle));
}
function resetOfficeForm(){document.getElementById('oid').value='';document.getElementById('oname').value='';document.getElementById('oref').value='';document.getElementById('oftitle').textContent='Nueva oficina / sector'}
function editOffice(id){const o=offices.find(x=>x.id===id);if(!o)return;document.getElementById('oid').value=o.id;document.getElementById('oname').value=o.nombre;document.getElementById('oarea').value=o.area_id||'';document.getElementById('osede').value=o.sede_id||'';document.getElementById('oref').value=o.referencia||'';document.getElementById('oftitle').textContent='Editar oficina';scrollTo({top:0,behavior:'smooth'})}
async function saveOffice(ev){ev.preventDefault();const id=document.getElementById('oid').value;const data={nombre:document.getElementById('oname').value.trim(),area_id:document.getElementById('oarea').value,sede_id:document.getElementById('osede').value,referencia:document.getElementById('oref').value.trim()||null};const r=id?await db.from('oficinas').update(data).eq('id',id):await db.from('oficinas').insert(data);if(r.error)return alert(r.error.message);await refresh(id?'Oficina actualizada. El QR sigue siendo el mismo.':'Oficina creada con QR nuevo.')}
async function duplicateOffice(id){const o=offices.find(x=>x.id===id);if(!o)return;const name=prompt('Nombre de la copia:','PRUEBA - '+o.nombre);if(!name||!name.trim())return;const r=await db.from('oficinas').insert({nombre:name.trim(),area_id:o.area_id,sede_id:o.sede_id,numero:o.numero,referencia:'Copia de '+o.nombre+'. '+(o.referencia||'')}).select('id,slug_qr').single();if(r.error)return alert(r.error.message);await refresh('Oficina duplicada sin bienes y con QR nuevo.')}
async function toggleOffice(id){const o=offices.find(x=>x.id===id);if(!o)return;const c=counts['o:'+id]||0;if(o.activa&&c>0)return alert('Esta oficina tiene '+c+' bienes activos. Primero movelos a otra oficina; después se puede desactivar sin perder historial.');if(o.activa&&!confirm('¿Desactivar '+o.nombre+'? Su QR dejará de mostrar una oficina activa, pero el historial se conserva.'))return;const r=await db.from('oficinas').update({activa:!o.activa}).eq('id',id);if(r.error)return alert(r.error.message);await refresh(o.activa?'Oficina desactivada.':'Oficina reactivada.')}
function renderUsers(){
const v=document.getElementById('view');const reg=base+'registro.html';
v.innerHTML='<div class="card"><div class="title">Crear / autorizar usuario</div><div class="muted">Podés crear la cuenta completa desde acá. Para un usuario nuevo ingresá una contraseña inicial de al menos 8 caracteres; después puede cambiarla con “Olvidé mi contraseña”.</div><div class="muted" style="margin-top:6px"><b>Administrador:</b> configuración completa · <b>Operador:</b> gestión de inventario · <b>Relevador:</b> relevamientos · <b>Consulta:</b> solo lectura.</div><form id="uform"><div class="grid"><div class="field"><label>Nombre</label><input id="uname" required></div><div class="field"><label>Correo</label><input id="uemail" type="email" required></div><div class="field"><label>Rol</label><select id="urole"><option value="admin">Administrador</option><option value="operador">Operador</option><option value="relevador">Relevador</option><option value="consulta">Consulta</option></select></div><div class="field"><label>Contraseña inicial</label><input id="upassword" type="password" minlength="8" autocomplete="new-password" placeholder="Solo obligatoria si la cuenta es nueva"><div class="isub">No se guarda en la base de datos del panel; se usa para crear el acceso en Supabase Auth.</div></div></div><button class="btn green">Crear / actualizar usuario</button></form><div class="item"><div class="ititle">Alternativa: que el usuario cree su contraseña</div><div class="isub">Si preferís no conocer su contraseña, autorizalo y pasale este enlace: '+e(reg)+'</div><button id="copyreg" class="btn blue" style="margin-top:8px">Copiar enlace de registro</button></div></div><div class="card"><div class="title">Usuarios autorizados</div><div id="ulist"></div></div>';
document.getElementById('uform').onsubmit=saveUser;document.getElementById('copyreg').onclick=async()=>{try{await navigator.clipboard.writeText(reg);alert('Enlace copiado.')}catch{prompt('Copiá este enlace:',reg)}};
document.getElementById('ulist').innerHTML=authorized.map(u=>{const p=profiles.find(x=>(x.email||'').toLowerCase()===u.email.toLowerCase());return '<div class="item"><div class="between"><div><div class="ititle">'+e(u.nombre||u.email)+'</div><div class="isub">'+e(u.email)+' · '+e(u.rol)+(p?' · cuenta creada':' · falta crear contraseña/cuenta')+'</div></div><span class="pill '+(u.activo?'':'off')+'">'+(u.activo?'Activo':'Inactivo')+'</span></div><div class="actions">'+(!p?'<button class="btn green" data-ucreate="'+u.id+'">Crear contraseña</button>':'')+'<button class="btn blue" data-uedit="'+u.id+'">Editar rol</button><button class="btn '+(u.activo?'orange':'green')+'" data-utoggle="'+u.id+'">'+(u.activo?'Desactivar':'Activar')+'</button></div></div>'}).join('')||'<div class="muted">No hay usuarios autorizados.</div>';
document.querySelectorAll('[data-ucreate]').forEach(b=>b.onclick=()=>prepareUserCreate(b.dataset.ucreate));document.querySelectorAll('[data-uedit]').forEach(b=>b.onclick=()=>editUser(b.dataset.uedit));document.querySelectorAll('[data-utoggle]').forEach(b=>b.onclick=()=>toggleUser(b.dataset.utoggle));
}
function prepareUserCreate(id){const u=authorized.find(x=>x.id===id);if(!u)return;document.getElementById('uname').value=u.nombre||'';document.getElementById('uemail').value=u.email||'';document.getElementById('urole').value=u.rol||'relevador';document.getElementById('upassword').value='';document.getElementById('upassword').focus();scrollTo({top:0,behavior:'smooth'})}
async function saveUser(ev){ev.preventDefault();const email=document.getElementById('uemail').value.trim().toLowerCase(),nombre=document.getElementById('uname').value.trim(),rol=document.getElementById('urole').value,password=document.getElementById('upassword').value;const existing=profiles.find(x=>(x.email||'').toLowerCase()===email);if(!existing&&password.length<8)return alert('Para crear una cuenta nueva, ingresá una contraseña de al menos 8 caracteres.');busyUser(true);try{const r=await db.functions.invoke('crear-usuario-patrimonial',{body:{email,nombre,rol,password}});if(r.error)throw r.error;if(r.data?.error)throw new Error(r.data.error);await refresh(r.data?.created?'Usuario creado. Ya puede ingresar con el correo y la contraseña que cargaste.':'Usuario actualizado. La cuenta ya existía.')}catch(err){alert('No se pudo guardar el usuario: '+(err.message||err))}finally{busyUser(false)}}
function busyUser(on){const b=document.querySelector('#uform button[type="submit"],#uform button');if(b){b.disabled=on;b.textContent=on?'Creando usuario...':'Crear / actualizar usuario'}}
async function editUser(id){const u=authorized.find(x=>x.id===id);if(!u)return;const roles=['admin','operador','relevador','consulta'];const role=prompt('Rol: admin / operador / relevador / consulta',u.rol);if(role===null||!roles.includes(role.trim().toLowerCase()))return alert('Rol no válido.');const name=prompt('Nombre:',u.nombre||'');if(name===null)return;const nr=role.trim().toLowerCase();let r=await db.from('usuarios_autorizados').update({rol:nr,nombre:name.trim()||null}).eq('id',id);if(r.error)return alert(r.error.message);const p=profiles.find(x=>(x.email||'').toLowerCase()===u.email.toLowerCase());if(p){r=await db.from('profiles').update({rol:nr,nombre:name.trim()||p.nombre}).eq('id',p.id);if(r.error)return alert(r.error.message)}await refresh('Usuario actualizado.')}
async function toggleUser(id){const u=authorized.find(x=>x.id===id);if(!u)return;if(u.email.toLowerCase()===(profile.email||'').toLowerCase()&&u.activo)return alert('No podés desactivar tu propio usuario desde acá.');if(u.activo&&u.rol==='admin'&&authorized.filter(x=>x.activo&&x.rol==='admin').length<=1)return alert('No se puede desactivar el último administrador.');const active=!u.activo;let r=await db.from('usuarios_autorizados').update({activo:active}).eq('id',id);if(r.error)return alert(r.error.message);const p=profiles.find(x=>(x.email||'').toLowerCase()===u.email.toLowerCase());if(p){r=await db.from('profiles').update({activo:active}).eq('id',p.id);if(r.error)return alert(r.error.message)}await refresh(active?'Usuario activado.':'Usuario desactivado.')}
function renderResponsables(){
const activeAssign=assignments.filter(a=>!a.fecha_hasta);const v=document.getElementById('view');
v.innerHTML='<div class="grid"><div class="card"><div class="title">Nuevo responsable</div><form id="rform"><div class="field"><label>Nombre</label><input id="rname" required></div><div class="grid"><div class="field"><label>Cargo</label><input id="rcargo"></div><div class="field"><label>Documento (opcional)</label><input id="rdoc"></div></div><button class="btn green">Guardar responsable</button></form></div><div class="card"><div class="title">Asignar encargado</div><form id="asform"><div class="field"><label>Responsable</label><select id="asresp" required><option value="">Elegí...</option>'+responsables.filter(r=>r.activo).map(r=>'<option value="'+r.id+'">'+e(r.nombre)+'</option>').join('')+'</select></div><div class="field"><label>Destino</label><select id="astype"><option value="area">Área</option><option value="oficina">Oficina / sector</option></select></div><div class="field"><label>Área u oficina</label><select id="astarget"></select></div><div class="field"><label>Cargo en ese destino</label><input id="ascargo" placeholder="Director, Secretario, encargado..."></div><button class="btn green">Asignar</button></form></div></div><div class="card"><div class="title">Responsables</div><div id="rlist"></div></div><div class="card"><div class="title">Asignaciones vigentes</div><div id="aslist"></div></div>';
document.getElementById('rform').onsubmit=saveResp;document.getElementById('asform').onsubmit=saveAssign;document.getElementById('astype').onchange=fillTargets;fillTargets();
document.getElementById('rlist').innerHTML=responsables.map(r=>'<div class="item"><div class="between"><div><div class="ititle">'+e(r.nombre)+'</div><div class="isub">'+e(r.cargo||'Sin cargo')+(r.documento?' · Doc. '+e(r.documento):'')+'</div></div><span class="pill '+(r.activo?'':'off')+'">'+(r.activo?'Activo':'Inactivo')+'</span></div><div class="actions"><button class="btn blue" data-redit="'+r.id+'">Editar</button><button class="btn '+(r.activo?'orange':'green')+'" data-rtoggle="'+r.id+'">'+(r.activo?'Desactivar':'Activar')+'</button></div></div>').join('');
document.getElementById('aslist').innerHTML=activeAssign.map(a=>'<div class="item"><div class="ititle">'+e(a.responsables?.nombre||'Responsable')+'</div><div class="isub">'+e(a.cargo||'Encargado')+' · '+e(a.oficinas?.nombre||a.areas?.nombre||'Destino')+'</div><button class="btn orange" data-aend="'+a.id+'" style="margin-top:8px">Finalizar asignación</button></div>').join('')||'<div class="muted">No hay asignaciones vigentes.</div>';
document.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>editResp(b.dataset.redit));document.querySelectorAll('[data-rtoggle]').forEach(b=>b.onclick=()=>toggleResp(b.dataset.rtoggle));document.querySelectorAll('[data-aend]').forEach(b=>b.onclick=()=>endAssign(b.dataset.aend));
}
function fillTargets(){const t=document.getElementById('astype').value,target=document.getElementById('astarget');target.innerHTML=(t==='area'?areas.filter(a=>a.activo).map(a=>'<option value="'+a.id+'">'+e(a.nombre)+'</option>'):offices.filter(o=>o.activa).map(o=>'<option value="'+o.id+'">'+e(o.nombre)+'</option>')).join('')}
async function saveResp(ev){ev.preventDefault();const r=await db.from('responsables').insert({nombre:document.getElementById('rname').value.trim(),cargo:document.getElementById('rcargo').value.trim()||null,documento:document.getElementById('rdoc').value.trim()||null});if(r.error)return alert(r.error.message);await refresh('Responsable creado.')}
async function editResp(id){const r=responsables.find(x=>x.id===id);if(!r)return;const name=prompt('Nombre:',r.nombre);if(!name||!name.trim())return;const cargo=prompt('Cargo:',r.cargo||'');if(cargo===null)return;const q=await db.from('responsables').update({nombre:name.trim(),cargo:cargo.trim()||null}).eq('id',id);if(q.error)return alert(q.error.message);await refresh('Responsable actualizado.')}
async function toggleResp(id){const r=responsables.find(x=>x.id===id);if(!r)return;if(r.activo&&assignments.some(a=>a.responsable_id===id&&!a.fecha_hasta))return alert('Primero finalizá sus asignaciones vigentes.');const q=await db.from('responsables').update({activo:!r.activo}).eq('id',id);if(q.error)return alert(q.error.message);await refresh(r.activo?'Responsable desactivado.':'Responsable reactivado.')}
async function saveAssign(ev){ev.preventDefault();const type=document.getElementById('astype').value,target=document.getElementById('astarget').value,resp=document.getElementById('asresp').value,cargo=document.getElementById('ascargo').value.trim()||null;if(!target||!resp)return;const today=new Date().toISOString().slice(0,10);let q=db.from('asignaciones_responsables').update({fecha_hasta:today}).is('fecha_hasta',null);q=type==='area'?q.eq('area_id',target):q.eq('oficina_id',target);let r=await q;if(r.error)return alert(r.error.message);const data={responsable_id:resp,cargo,fecha_desde:today};if(type==='area')data.area_id=target;else data.oficina_id=target;r=await db.from('asignaciones_responsables').insert(data);if(r.error)return alert(r.error.message);await refresh('Encargado asignado.')}
async function endAssign(id){if(!confirm('¿Finalizar esta asignación?'))return;const r=await db.from('asignaciones_responsables').update({fecha_hasta:new Date().toISOString().slice(0,10)}).eq('id',id);if(r.error)return alert(r.error.message);await refresh('Asignación finalizada.')}
async function refresh(msg){await load();shell();if(msg)alert(msg)}
async function boot(){try{await auth();if(!session||!profile||!profile.activo||profile.rol!=='admin'){app.innerHTML='<div class="card"><div class="title">Acceso restringido</div><div class="muted">Esta pantalla es solo para administradores.</div><a class="btn blue" style="display:inline-block;text-decoration:none;margin-top:10px" href="'+base+'">Volver al sistema</a></div>';return}await load();shell()}catch(err){app.innerHTML='<div class="error">'+e(err.message||err)+'</div>'}}
boot();
</script>
</body>
</html>
