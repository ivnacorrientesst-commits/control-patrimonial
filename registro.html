<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><title>Crear acceso · Control Patrimonial</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f6f8;color:#17212b}.top{background:linear-gradient(135deg,#087f5b,#0ca678);color:#fff;padding:14px}.wrap{max-width:480px;margin:7vh auto;padding:12px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 18px #0001}.title{font-size:22px;font-weight:900}.muted{color:#667085;font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input{width:100%;padding:12px;border:1px solid #cfd8dc;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:12px;font-weight:800;cursor:pointer;width:100%}.green{background:#087f5b;color:#fff}.ghost{background:#edf2f4;color:#263238}.error{background:#fff0f0;color:#b42318;border:1px solid #ffc9c9;padding:10px;border-radius:10px;margin:10px 0}.ok{background:#ebfbee;color:#2b8a3e;border:1px solid #b2f2bb;padding:10px;border-radius:10px;margin:10px 0}</style>
</head>
<body><div class="top"><b>Municipalidad de Santo Tomé</b><div style="font-size:13px;opacity:.9">Control Patrimonial</div></div><div class="wrap"><div class="card"><div class="title">Crear acceso</div><p class="muted">Usá el correo que fue autorizado por un administrador. Cada persona crea su propia contraseña.</p><div id="msg"></div><form id="f"><div class="field"><label>Nombre y apellido</label><input id="name" required autocomplete="name"></div><div class="field"><label>Correo</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="p1" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Repetir contraseña</label><input id="p2" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn green">Crear cuenta</button></form><button id="back" class="btn ghost" style="margin-top:8px">Volver</button></div></div>
<script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.112.2';const db=createClient('https://jqbeweclwqquevfpycyh.supabase.co','sb_publishable_pmrA8WStSO7tYb9yEeYMQQ_dQiDNIFm');const msg=document.getElementById('msg');const base=location.href.replace(/registro\.html.*$/,'');document.getElementById('back').onclick=()=>location.href=base;document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();msg.innerHTML='';const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1!==p2){msg.innerHTML='<div class="error">Las contraseñas no coinciden.</div>';return}const r=await db.auth.signUp({email,password:p1,options:{data:{full_name:name},emailRedirectTo:base}});if(r.error){msg.innerHTML='<div class="error">No se pudo crear la cuenta: '+r.error.message+'</div>';return}msg.innerHTML='<div class="ok">Cuenta creada. Si Supabase solicita confirmar el correo, revisá tu bandeja y Spam. Después podés ingresar al sistema con ese correo y contraseña.</div>';document.getElementById('f').reset()};</script></body></html>
